<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Arcus | Cafeteria Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="dashboard-header">
        <div>
            <h1>🏫 AC Arcus School Cafeteria</h1>
            <p>Cafeteria Management Dashboard</p>
        </div>

        <div class="header-actions">
            <span id="who"></span>
            <button id="btn-logout">
                Logout
            </button>
        </div>
    </header>

    <br />

    <nav class="dashboard-nav">
        <button onclick="showSection('dashboard-section')">
            Dashboard
        </button>

        <button onclick="showSection('products-section')">
            Products
        </button>

        <button onclick="showSection('categories-section')">
            Categories
        </button>
    </nav>

    <section id="dashboard-section">
        <main class="dashboard-container">

            <!-- Welcome -->
            <section class="welcome-card">
                <h2>Welcome back 👋</h2>
                <p>
                    Manage your school cafeteria menu, products and categories from one place.
                </p>
            </section>

            <br>

            <!-- Statistics -->
            <section class="stats-section">

                <h2>Statistics</h2>
                <br />
                <div class="stats-grid">

                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th>🍽 Products</th>
                                <th>📂 Categories</th>
                                <th>👥 Users</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td id="product-count">0</td>
                                <td id="category-count">0</td>
                                <td id="user-count">0</td>
                            </tr>
                        </tbody>
                    </table>
                    <br />
                </div>

            </section>


            <!-- Quick actions -->
            <section class="quick-actions">

                <h2>Quick Actions</h2>

                <br />

                <div class="action-buttons">

                    <button class="action-btn">
                        ➕ Add Product
                    </button>

                    <button class="action-btn">
                        📂 Add Category
                    </button>

                </div>

            </section>
        </main>
    </section>


    <section id="products-section" class="hidden">
        <br />
        <main class="products-container">

            <h2>Products</h2>


            <!-- Date navigation -->
            <div class="date-selector">

                <button id="previous-day">
                    ◀
                </button>

                <div class="current-date">
                    <h3 id="selected-date">
                        08 July 2026
                    </h3>

                    <button id="today-button">
                        Today
                    </button>
                </div>

                <button id="next-day">
                    ▶
                </button>

            </div>


            <!-- Products table -->
            <table class="products-table">

                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Allergens</th>
                    </tr>
                </thead>

                <tbody id="products-list">

                    <!-- JavaScript fills this -->

                </tbody>

            </table>


            <!-- Add button -->
            <button class="action-btn add-product-btn">
                ➕ Add Product
            </button>


        </main>

    </section>


    <section id="categories-section" class="hidden">
        <!-- Categories page content -->
    </section>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>
